server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_PASSWORD:youshallnotpass}
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.17.0"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - WEB
      - MUSIC
      - ANDROID_TESTSUITE
      - ANDROID_VR
    oauth:
      enabled: true
      refreshToken: ${YOUTUBE_REFRESH_TOKEN:}
    potoken:
      token: ${YOUTUBE_PO_TOKEN:}
      visitorData: ${YOUTUBE_VISITOR_DATA:}

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
