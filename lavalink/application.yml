server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "ahmed"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
  # REMOVED plugins section - we pre-download the JAR in Dockerfile
  # This prevents Lavalink from trying to "update" it

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - WEB
      - MWEB
      - IOS
    oauth:
      enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
