    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
    oauth:
      enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
