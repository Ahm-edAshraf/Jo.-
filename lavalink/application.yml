server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "ahmed"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # Search-capable clients (queried first)
      - MUSIC
      - WEB
      # OAuth-compatible clients for playback
      - ANDROID_MUSIC
      - IOS
    oauth:
      enabled: true
      refreshToken: ${YOUTUBE_REFRESH_TOKEN:}

logging:
  level:
    root: INFO
    lavalink: INFO
