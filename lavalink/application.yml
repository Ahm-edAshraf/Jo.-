server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "ahmed"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID_MUSIC
      - IOS
      - TV
    oauth:
      enabled: true
      # Set YOUTUBE_REFRESH_TOKEN env variable in Railway with the refresh token from the logs

logging:
  level:
    root: INFO
    lavalink: INFO
